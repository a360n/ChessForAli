<!DOCTYPE html>
<html>
<head>
  <title>PyPI Direct Downloader & Uploader</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    button { background: #0070f3; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin: 5px; font-weight: bold; }
    button:hover { background: #0051a8; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #1e1e1e; padding: 15px; border-radius: 5px; }
    .link-item { margin: 10px 0; display: block; background: #222; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>PyPI Offline Package Downloader & Uploader</h1>
  <p>Stream packages from PyPI to the local workspace via the browser and a local FastAPI server.</p>
  
  <button id="fetch-btn">1. Fetch Download Links</button>
  <button id="upload-all-btn" disabled>2. Download & Upload All</button>
  
  <div id="links-container"></div>
  <div id="status">Ready. Make sure upload_server.py is running on port 8099!</div>

  <script>
    const packages = [
      'chess',
      'moviepy',
      'decorator',
      'imageio',
      'imageio-ffmpeg',
      'proglog',
      'cairosvg',
      'cairocffi',
      'tinycss2',
      'cssselect2',
      'defusedxml',
      'webencodings'
    ];

    let fetchedPackages = [];

    document.getElementById('fetch-btn').addEventListener('click', async () => {
      const statusDiv = document.getElementById('status');
      const container = document.getElementById('links-container');
      container.innerHTML = '';
      fetchedPackages = [];
      document.getElementById('upload-all-btn').disabled = true;
      statusDiv.textContent = 'Fetching package data...\n';

      for (const pkg of packages) {
        try {
          statusDiv.textContent += `Fetching ${pkg}... `;
          const response = await fetch(`https://pypi.org/pypi/${pkg}/json`);
          const data = await response.json();
          
          const urls = data.urls;
          let wheelUrl = null;
          let filename = '';
          
          // 1. Prefer pure python wheels or generic ones
          for (const url of urls) {
            if (url.packagetype === 'bdist_wheel' && !url.filename.includes('macos') && !url.filename.includes('win') && !url.filename.includes('manylinux')) {
              wheelUrl = url.url;
              filename = url.filename;
              break;
            }
          }
          
          // 2. If no pure wheel, find any wheel
          if (!wheelUrl) {
            for (const url of urls) {
              if (url.packagetype === 'bdist_wheel') {
                wheelUrl = url.url;
                filename = url.filename;
                break;
              }
            }
          }
          
          // 3. If still no wheel, find sdist (source tarball)
          if (!wheelUrl) {
            for (const url of urls) {
              if (url.packagetype === 'sdist') {
                wheelUrl = url.url;
                filename = url.filename;
                break;
              }
            }
          }

          if (wheelUrl) {
            statusDiv.textContent += `Found: ${filename}\n`;
            fetchedPackages.push({ pkg, url: wheelUrl, filename });
            
            const div = document.createElement('div');
            div.className = 'link-item';
            div.textContent = `${pkg} -> ${filename}`;
            container.appendChild(div);
          } else {
            statusDiv.textContent += `Not found!\n`;
          }
        } catch (err) {
          statusDiv.textContent += `Error: ${err.message}\n`;
        }
      }
      
      if (fetchedPackages.length > 0) {
        document.getElementById('upload-all-btn').disabled = false;
        statusDiv.textContent += `\nAll packages fetched. Total ${fetchedPackages.length} packages ready to stream!`;
      }
    });

    document.getElementById('upload-all-btn').addEventListener('click', async () => {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = 'Starting download and upload stream...\n';
      
      for (const item of fetchedPackages) {
        try {
          statusDiv.textContent += `Streaming ${item.pkg} (${item.filename})... `;
          
          // 1. Fetch file from PyPI
          const fileRes = await fetch(item.url);
          const blob = await fileRes.blob();
          
          statusDiv.textContent += `Downloaded. Uploading to local server... `;
          
          // 2. Upload to local server
          const formData = new FormData();
          formData.append('file', blob, item.filename);
          
          const uploadRes = await fetch(`http://127.0.0.1:8099/upload?filename=${item.filename}`, {
            method: 'POST',
            body: formData
          });
          
          if (uploadRes.ok) {
            statusDiv.textContent += `SUCCESS!\n`;
          } else {
            statusDiv.textContent += `FAILED (HTTP ${uploadRes.status})!\n`;
          }
        } catch (err) {
          statusDiv.textContent += `ERROR: ${err.message}\n`;
        }
      }
      
      statusDiv.textContent += '\nStream finished! Check the "/Users/alial-khazali/Documents/ChessForAli/wheels" directory.';
    });
  </script>
</body>
</html>
